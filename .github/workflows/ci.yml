name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Prisma only needs a syntactically valid URL to generate the client.
      # CI does not connect to a database.
      DATABASE_URL: postgresql://user:pass@localhost:5432/ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      # `npm run lint` is left out for now: the existing code has outstanding
      # ESLint errors, so a lint step would fail every run.

      - name: Test
        run: npm test

      - name: Build
        # Not `npm run build`: that also runs `prisma migrate deploy` against a real database.
        run: npx next build
