<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <!-- Vibrant Gold/Amber Gradient -->
    <linearGradient id="gold-gradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="30%" stop-color="#f59e0b" />
      <stop offset="70%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>
    <!-- Sleek dark background gradient -->
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <filter id="subtle-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#f59e0b" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Base Circle Container -->
  <circle cx="16" cy="16" r="15" fill="url(#bg-gradient)" stroke="url(#gold-gradient)" stroke-width="1.5" />

  <!-- Elegant World Cup Trophy / Soccer Emblem Concept -->
  <g filter="url(#subtle-glow)">
    <!-- Stylized trophy cups / arms -->
    <path d="M 9,12 C 9,17.5 11,20.5 16,20.5 C 21,20.5 23,17.5 23,12 C 19.5,12.5 16,11 16,11 C 16,11 12.5,12.5 9,12 Z" fill="url(#gold-gradient)" />
    <!-- Trophy Base -->
    <path d="M 12,24 L 20,24 L 18,21 L 14,21 Z" fill="url(#gold-gradient)" opacity="0.9" />
    <rect x="13" y="25" width="6" height="2" rx="0.5" fill="url(#gold-gradient)" />
    
    <!-- Stylized Soccer Ball on top of the trophy -->
    <circle cx="16" cy="10" r="4.5" fill="url(#bg-gradient)" stroke="url(#gold-gradient)" stroke-width="1.2" />
    <!-- Ball pattern -->
    <polygon points="16,8.2 17.5,9.3 16.9,11.1 15.1,11.1 14.5,9.3" fill="url(#gold-gradient)" />
    <line x1="16" y1="8.2" x2="16" y2="5.5" stroke="url(#gold-gradient)" stroke-width="0.8" />
    <line x1="17.5" y1="9.3" x2="19.8" y2="8.3" stroke="url(#gold-gradient)" stroke-width="0.8" />
    <line x1="16.9" y1="11.1" x2="18.5" y2="13" stroke="url(#gold-gradient)" stroke-width="0.8" />
    <line x1="15.1" y1="11.1" x2="13.5" y2="13" stroke="url(#gold-gradient)" stroke-width="0.8" />
    <line x1="14.5" y1="9.3" x2="12.2" y2="8.3" stroke="url(#gold-gradient)" stroke-width="0.8" />
  </g>
</svg>
